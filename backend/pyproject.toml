[project]
name = "backend"
version = "0.1.0"
description = "Vehicle plate detection backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.3",
    "python-multipart>=0.0.9",
    "requests>=2.32.3",
    "aiohttp>=3.9.0",
    "aiortc>=1.9.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "inference-sdk>=1.2.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
